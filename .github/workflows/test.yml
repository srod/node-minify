name: Test

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: Set up JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '11.0.33+10'
          distribution: 'temurin'

      - name: Use Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run ci

      - name: Guard - no removed compressor references
        # Static grep over source, docs and action files: OS- and Node-version
        # independent, so one leg is enough.
        if: runner.os == 'Linux' && matrix.node-version == '22.x'
        run: bash scripts/ci-guard-removed-compressors.sh

      - name: Guard - no banned type suppressions
        # Static grep over hand-written code: covers @ts-nocheck (invisible to
        # Biome), @ts-expect-error in src/, and reason-less directives. OS- and
        # Node-version independent, so one leg is enough.
        if: runner.os == 'Linux' && matrix.node-version == '22.x'
        run: bash scripts/ci-guard-type-suppressions.sh

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true
