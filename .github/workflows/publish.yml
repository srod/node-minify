name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write
  # Required to dispatch release-action.yml after the release is created.
  actions: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: 🦋 Changesets Release
    runs-on: ubuntu-latest
    outputs:
      published_packages: ${{ steps.changesets.outputs.publishedPackages }}
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: ⚙️ Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: 🔧 Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🚀 Create Release Pull Request or Publish to NPM
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          publish: bun run changeset:release
          version: bun run changeset:version
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: 📦 Create Aggregated GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(jq -r '.version' packages/core/package.json)

          # One body from every package CHANGELOG: changesets writes a
          # change only into the packages it touches, so core's file alone
          # misses most of them. The script looks up each change's PR with
          # `gh api`, which needs GITHUB_TOKEN.
          bun scripts/release-notes.ts "$VERSION" > /tmp/release-notes.md

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Releases created with GITHUB_TOKEN do not emit `release: published`,
      # so release-action.yml would never run on its own. workflow_dispatch is
      # exempt from that recursion guard, so trigger it explicitly to publish
      # the action's version and major tags.
      - name: 🏷️ Trigger action tag release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(jq -r '.version' packages/core/package.json)
          gh workflow run release-action.yml -f tag="v${VERSION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
